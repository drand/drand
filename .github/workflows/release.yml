name: goreleaser

on:
  push:
    tags:
      - 'v*'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version.go and compare with tags
        shell: bash
        run: |
          set -euo pipefail
          FILE="common/version.go"

          # Extract numeric fields
          MAJOR="$(sed -nE 's/^[[:space:]]*Major:[[:space:]]*([0-9]+),.*/\1/p' "$FILE")"
          MINOR="$(sed -nE 's/^[[:space:]]*Minor:[[:space:]]*([0-9]+),.*/\1/p' "$FILE")"
          PATCH="$(sed -nE 's/^[[:space:]]*Patch:[[:space:]]*([0-9]+),.*/\1/p' "$FILE")"
          PRERELEASE="$(sed -nE 's/^[[:space:]]*Prerelease:[[:space:]]*"([^"]*)",.*/\1/p' "$FILE")"

          if [[ -z "${MAJOR}" || -z "${MINOR}" || -z "${PATCH}" || -z "${PRERELEASE+x}" ]]; then
            echo "Could not parse version fields from ${FILE}"
            echo "Need Major.Minor.Patch-Prerelease entries like:"
            echo '  Major: 2.1.5-pre1'
            exit 1
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}${PRERELEASE}"

          # Basic validation: prerelease must be "" or start with "-"
          if [[ -n "${PRERELEASE}" && "${PRERELEASE}" != -* ]]; then
            echo "Prerelease must be empty or start with '-'. Got: '${PRERELEASE}'"
            exit 1
          fi

          EXPECTED_TAG="v${VERSION}"

          # Get the tag that triggered this workflow
          PUSHED_TAG="${GITHUB_REF#refs/tags/}"

          echo "Pushed tag:       ${PUSHED_TAG}"
          echo "Expected tag:     ${EXPECTED_TAG}"

          # The pushed tag must MATCH version.go
          if [[ "${PUSHED_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "ERROR: Tag '${PUSHED_TAG}' does not match version in ${FILE} ('${EXPECTED_TAG}')."
            echo "Update ${FILE} so the version matches the tag you are pushing."
            exit 1
          fi

          # Compare against the PREVIOUS tag, excluding the one we just pushed
          PREVIOUS_TAG="$(git tag -l 'v*' --sort=-v:refname | grep -vxF "${PUSHED_TAG}" | head -n1 || true)"

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            PREVIOUS_NORM="${PREVIOUS_TAG#v}"

            FILE_BASE="${VERSION%%[-+]*}"
            PREVIOUS_BASE="${PREVIOUS_NORM%%[-+]*}"

            ver_to_int() {
              local v="$1"
              IFS=. read -r a b c <<<"$v"
              printf "%d%03d%03d" "$a" "$b" "$c"
            }

            if [[ "$(ver_to_int "$FILE_BASE")" -le "$(ver_to_int "$PREVIOUS_BASE")" ]]; then
              echo "ERROR: version.go (${FILE_BASE}) must be greater than previous tag (${PREVIOUS_BASE})."
              exit 1
            fi
          fi

          echo "OK — tag ${PUSHED_TAG} matches ${FILE} and is newer than ${PREVIOUS_TAG:-'(none)'}."

  goreleaser:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: '25.3'

      - name: Install Protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.32.0
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
          go mod tidy

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
